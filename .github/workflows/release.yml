name: Publish release

"on":
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify source and behavior
        run: |
          node --test
          node scripts/check-privacy.cjs
      - name: Read release version
        id: metadata
        shell: bash
        run: |
          RELEASE_VERSION="$(node -p "require('./package.json').version")"
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "RELEASE_DIST=$RUNNER_TEMP/ima-agent-memory-release" >> "$GITHUB_ENV"
      - name: Build reviewed skill and checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mkdir -p "$RELEASE_DIST"
          node scripts/build-skill.cjs --output "$RELEASE_DIST/ima-agent-memory-workbuddy-v$RELEASE_VERSION.zip"
          cp docs/install.md "$RELEASE_DIST/INSTALL.md"
          cd "$RELEASE_DIST"
          sha256sum "ima-agent-memory-workbuddy-v$RELEASE_VERSION.zip" INSTALL.md > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Upload draft assets and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          RELEASE_TAG="v$RELEASE_VERSION"
          if RELEASE_IS_DRAFT="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$RELEASE_IS_DRAFT" != true ]]; then
              echo "Release $RELEASE_TAG is already published; leaving its assets unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "v$RELEASE_VERSION - Shared agent memory" \
              --notes-file docs/release-notes.md --draft
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$RELEASE_DIST/ima-agent-memory-workbuddy-v$RELEASE_VERSION.zip" \
            "$RELEASE_DIST/SHA256SUMS" "$RELEASE_DIST/INSTALL.md"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
